<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | NetherPunch Gaming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/public/css/signin.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <main class="layout signin-layout">
      <header class="top-nav">
        <nav class="left-nav" aria-label="Primary">
          <span class="brand-icon">🎮</span>
          <a href="/">Home</a>
          <a href="/ozrust">OzRust</a>
          <a href="/rustygoose">RustyGoose</a>
          <a href="/leaderboard">Leaderboard</a>
        </nav>

        <div class="logo-block">NETHERPUNCH</div>

        <div class="right-nav">
          <a class="btn btn-ghost" href="/signin">Sign In</a>
        </div>
      </header>

      <section class="signin-shell">
        <h1>Sign in required</h1>
        <p class="signin-copy">You can browse OzRust kits without signing in. Sign in is only required when you purchase or access protected player pages.</p>



        <div class="demo-credentials" aria-live="polite">
          <p><strong>Demo login</strong></p>
          <p>Username: <code>admin</code> &nbsp; Password: <code>changeme</code></p>
          <button class="btn btn-ghost small" type="button" id="useDemoBtn">Use demo credentials</button>
        </div>

        <form id="signinForm" class="signin-form">
          <label>
            Username
            <input id="username" name="username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input id="password" type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn-ghost" type="submit">Sign in</button>
        </form>

        <p id="signinStatus" class="signin-status"></p>
      </section>
    </main>

    <script src="/public/js/signin.js"></script>
  </body>
</html>
