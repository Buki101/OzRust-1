<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netherpunch Sign In</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a href="#" class="top-link"><span class="icon">🎮</span> HOME</a>
        <h1>NETHERPUNCH</h1>
      </header>

      <main class="hero">
        <section class="signin-card" aria-label="Sign in form">
          <p class="eyebrow">ACCOUNT ACCESS</p>
          <h2>SIGN IN REQUIRED</h2>
          <p class="subtitle">
            You need to sign in before using subscriptions, leaderboards, or player pages.
          </p>

          <form>
            <label for="username">USERNAME</label>
            <input id="username" name="username" type="text" autocomplete="username" />

            <label for="password">PASSWORD</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />

            <button type="submit">SIGN IN</button>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
